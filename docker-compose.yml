services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: pis_db
      POSTGRES_USER: pis_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pis_local_dev}  # local-dev default; set a real one outside local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pis_user -d pis_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgresql://pis_user:${POSTGRES_PASSWORD:-pis_local_dev}@db:5432/pis_db
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      AUTH_ISSUER: ${AUTH_ISSUER:-}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-}
      AUTH_ROLE_CLAIM: ${AUTH_ROLE_CLAIM:-pis_roles}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}  # compose is the local-dev path; refused if APP_ENV is staging/production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./models:/app/models
      - ./features:/app/features

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
      PIS_API_TOKEN: ${PIS_API_TOKEN:-}
    depends_on:
      - api
    restart: on-failure

volumes:
  postgres_data:
